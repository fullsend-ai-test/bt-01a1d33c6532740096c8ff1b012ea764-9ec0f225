# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
tracker:
    github:
        allowed_targets:
            repos:
                - fullsend-ai/fullsend
                - fullsend-ai/agents
runtime: dummy
agents:
    - name: triage
      trigger: event.entity.kind == "work_item" && event.transition.kind == "comment_added" && has(event.transition.comment.command) && event.transition.comment.command == "/fs-triage" && event.actor.kind == "human"
